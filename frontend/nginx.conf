# Minimal static file server for the built admin dashboard. It's a
# single-page app with client-side routing disabled (one screen), so this
# just serves the built files with a sane fallback to index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
